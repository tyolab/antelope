[project]
name = "spoor-embed"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
gpu = ["pylate>=1.1.0", "torch>=2.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spoor_embed*"]
